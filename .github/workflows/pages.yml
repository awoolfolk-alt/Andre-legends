# Build the Next.js app as static files and publish it to the repository Pages URL:
# https://awoolfolk-alt.github.io/Andre-legends/
#
# In GitHub, set Settings → Pages → Build and deployment → Source to GitHub Actions.
# Every push to main deploys the complete site, including /game/ and its assets.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static Next.js site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /Andre-legends
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
